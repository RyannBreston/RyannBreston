<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Moda</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo-super-moda.png" alt="Super Moda Logo">
        </div>
        <button class="logout-btn">Sair</button>
        <div class="welcome-text">Bem-vindo, Visitante!</div>
    </header>
    <main>
        <section class="icon-grid">
            <!-- Linha 1 -->
            <a href="minhas-compras.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <p>Minhas Compras</p>
            </a>
            <a href="minhas-ofertas.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-tags"></i>
                </div>
                <p>Minhas Ofertas</p>
            </a>
            <a href="estilo-do-dia.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-star"></i>
                </div>
                <p>Estilo do Dia</p>
            </a>

            <!-- Linha 2 -->
            <a href="favoritos.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-heart"></i>
                </div>
                <p>Favoritos</p>
            </a>
            <a href="novas-colecoes.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-tshirt"></i>
                </div>
                <p>Novas Coleções</p>
            </a>
            <a href="promocoes.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-gift"></i>
                </div>
                <p>Promoções</p>
            </a>

            <!-- Linha 3 -->
            <a href="meu-perfil.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-user"></i>
                </div>
                <span class="badge">1</span>
                <p>Meu Perfil</p>
            </a>
            <a href="acompanhar-pedido.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-truck"></i>
                </div>
                <p>Acompanhar Pedido</p>
            </a>
            <a href="cupons.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-percentage"></i>
                </div>
                <p>Cupons</p>
            </a>

            <!-- Linha 4 -->
            <a href="fale-conosco.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-comment"></i>
                </div>
                <p>Fale Conosco</p>
            </a>
            <a href="indique-e-ganhe.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-users"></i>
                </div>
                <p>Indique e Ganhe</p>
            </a>
            <a href="look-inspiracao.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-camera"></i>
                </div>
                <p>Look Inspiração</p>
            </a>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
