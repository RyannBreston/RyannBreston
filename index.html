<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Moda</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo-super-moda.png" alt="Super Moda Logo">
        </div>
        <div class="notification">
            <i class="fas fa-bell"></i>
            <span class="badge" id="notification-count">2</span>
        </div>
        <button class="logout-btn">Sair</button>
        <div class="welcome-text">Bem-vindo, Visitante!</div>
    </header>
    <main>
        <section id="notification-modal" class="notification-modal hidden">
            <h2>Notificações</h2>
            <div class="notification-item">
                <p>Novo holerite de Abril 2025 disponível!</p>
                <p><small>09/04/2025</small></p>
            </div>
            <div class="notification-item">
                <p>Sua solicitação de férias foi aprovada.</p>
                <p><small>08/04/2025</small></p>
            </div>
            <button id="close-notifications">Fechar</button>
        </section>
        <section class="icon-grid">
            <!-- Linha 1 -->
            <a href="meus-dados.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-user"></i>
                </div>
                <p>Meus Dados</p>
            </a>
            <a href="meus-resultados.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-trophy"></i>
                </div>
                <p>Meus Resultados</p>
            </a>
            <a href="holerite.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-money-check-alt"></i>
                </div>
                <p>Holerite</p>
            </a>

            <!-- Linha 2 -->
            <a href="meu-ponto.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-clock"></i>
                </div>
                <p>Meu Ponto</p>
            </a>
            <a href="minhas-ferias.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-umbrella-beach"></i>
                </div>
                <p>Minhas Férias</p>
            </a>
            <a href="meus-bloqueios.html" class="icon-item">
                <div class="icon-circle">
                    <i class="fas fa-lock"></i>
                </div>
                <p>Meus Bloqueios</p>
            </a>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
