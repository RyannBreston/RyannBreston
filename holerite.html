<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holerite - Super Moda</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo-super-moda.png" alt="Super Moda Logo">
        </div>
        <h1>Holerite</h1>
        <button class="logout-btn">Sair</button>
    </header>
    <main>
        <section>
            <h2>Contracheque</h2>
            <div class="info-item">
                <p><strong>Mês:</strong> Março 2025</p>
                <p><strong>Salário Bruto:</strong> R$ 3.500,00</p>
                <p><strong>Descontos:</strong> R$ 450,00</p>
                <p><strong>Salário Líquido:</strong> R$ 3.050,00</p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
